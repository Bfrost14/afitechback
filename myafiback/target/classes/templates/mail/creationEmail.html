<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.activation.title}">Compte myafi</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p th:text="#{email.activation.greeting(${user.login})}">Cher</p>
    <p th:text="#{email.creation.text1}">Votre compte MYAFI a été crée avec success. Veuillez cliquer ici pour y acceder. Votre mot de passe par défaut est Passer@123 :</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/sign-in|})" th:href="${url}" th:text="${url}">Page de connexion</a>
    </p>
    <p>
      <span th:text="#{email.activation.text2}">Cordialement, </span>
      <br />
      <em th:text="#{email.signature}">MYAFI.</em>
    </p>
  </body>
</html>
