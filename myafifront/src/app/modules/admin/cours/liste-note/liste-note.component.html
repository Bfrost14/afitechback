<div class="grid grid-cols-1 justify-center w-full">
  <div class="m-4">
    <!-- @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ search @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ -->

    <ng-template #addNote>
      <app-ajout-note [noteId]="noteIdEdit" [note]="selectNoteEdit" (add)="setAdd($event)"></app-ajout-note>

    </ng-template>
    <ng-container *ngIf="!add; else addNote;">
      <ng-container *ngIf="!fiche">
        <div class="grid grid-cols-12  w-full max-w-xs sm:max-w-none mb-4">
          <div>
            <mat-form-field class=" fuse-mat-no-subscript w-full sm:w-0 " appearance="none">
              <button mat-mini-fab matSuffix class="bg-rouge-1  ">
                <mat-icon [svgIcon]="'heroicons_solid:search'"></mat-icon>
              </button>
              <mat-select [(value)]="selectedColumn" multiple (selectionChange)="addSearchFiels($event.value)"
                [compareWith]="compareWith">
                <mat-select-trigger>

                </mat-select-trigger>
                <mat-option *ngFor="let column of searchFieldList" [value]="column">
                  <span> {{column?.key | uppercase}} </span>

                </mat-option>
              </mat-select>

            </mat-form-field>
          </div>

          <!-- @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ form begining -->
          <div class="col-span-10 mt-4">
            <form [formGroup]="searchColumnForm" class="grid grid-cols-4 gap-2">
              <ng-container formArrayName="searchFilds">

                <div *ngFor="let val of searchFilds.controls; index as i" class="flex ">


                  <ng-container [formGroupName]="i">


                    <mat-form-field class="fuse-mat-no-subscript w-full sm:w-72 mt-4 sm:mt-0 sm:ml-4 fuse-mat-rounded"
                      [floatLabel]="'always'">
                      <mat-label>
                        <span>{{val?.value?.key | uppercase}}</span>

                      </mat-label>
                      <mat-icon matSuffix class="icon-size-5" [svgIcon]="'heroicons_solid:search'"></mat-icon>
                      <input [formControlName]="'value'" (keyup)="search()" matInput #query>

                    </mat-form-field>


                  </ng-container>
                </div>
              </ng-container>

            </form>
          </div>
          <!-- @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ form end @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ -->
          <div class="flex justify-end">

            <mat-form-field appearance="none" class="-mb-4 w-0 mr-10">
              <button matSuffix mat-mini-fab class="bg-rouge-1">
                <mat-icon>filter_list</mat-icon>
              </button>
              <mat-select [(ngModel)]="displayedColumns" multiple (selectionChange)="refreshColumnToDisplay($event)"
                [compareWith]="compareWith">
                <mat-select-trigger>

                </mat-select-trigger>
                <mat-option *ngFor="let column of displayedColumn" [value]="column">{{column | uppercase}}</mat-option>
              </mat-select>

            </mat-form-field>
          </div>
        </div>


        <div class="flex justify-end mb-2 -mt-4">

          <button class="ml-4" mat-flat-button class="bg-rouge-1 text-white" (click)="add = true">
            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
            <span class="ml-2 mr-1">{{'Ajouter une note' | titlecase}}</span>
          </button>


        </div>
      </ng-container>
    </ng-container>



    <div class="grid grid-col-1  divide-y-8 divide-bleue-claire-1">
      <div class=" flex  h-10 text-white  w-full -mb-0.5 justify-between  bg-rouge-1 p-1">

        <span class="mr-4 mt-1.5 font-bold">{{'Total Notes' | titlecase}}: {{resultsLength}}</span>
      </div>
      <table mat-table [dataSource]="data" multiTemplateDataRows matSort matSortDisableClear class="mat-elevation-z8">
        <ng-container matColumnDef="{{column}}" *ngFor="let column of columnsToDisplay">

          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear
            class="bg-bleue-claire-6 text-secondary text-md font-semibold"> {{column | titlecase }} </th>

          <ng-container *ngIf="column == 'matricule' ||  column == 'prenom' || column == 'nom' || column == 'filiere'  ; else elseMat">
            <td mat-cell *matCellDef="let element">

             {{element["user"][column]}}

            </td>
          </ng-container>

          <ng-template #elseMat>
            <td mat-cell *matCellDef="let element">
              {{ element[column]}}

            </td>
          </ng-template>


        </ng-container>




        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions"
            class="bg-bleue-foncee text-secondary text-md font-semibold">Action</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button aria-label="expand row"
              (click)="setDataSourceEdit(element); (expandedElementEdit = expandedElementEdit === element ? null : element); $event.stopPropagation()">

              <mat-icon *ngIf="expandedElementEdit !== element || !add " svgIcon="mat_solid:edit"
                class="text-bleue-foncee-1"></mat-icon>
              <mat-icon *ngIf="expandedElementEdit === element && add" svgIcon="mat_solid:edit_off"
                class="text-bleue-foncee-1"></mat-icon>

            </button>

          </td>
        </ng-container>

        <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
            <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">

              <div class="flex justify-center w-full bg-slate-300">
                <app-detail-note class="w-full" [noteId]="element.id"
                  *ngIf="expandedElement === element"></app-detail-note>
              </div>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand; "></tr>
        <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;" class="example-element-row"
          [class.example-expanded-row]="expandedElement === element">
        </tr>
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"
          [class.hidden]="noteId !== row.id"></tr>


      </table>

      <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
        showFirstLastButtons class="flex justify-end" [style.visibility]="fiche? 'hidden': 'visible'">
      </mat-paginator>

    </div>
  </div>

  <!-- No Data-->
  <ng-template #noData>
    <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
      <!-- <mat-icon
              class="icon-size-24"
              [svgIcon]="'heroicons_outline:document-search'"></mat-icon>
          <div class="mt-6 text-2xl font-semibold tracking-tight text-secondary">{{ 'module.notfound' | transloco }}</div> -->
      <app-loading></app-loading>
    </div>
  </ng-template>

</div>
