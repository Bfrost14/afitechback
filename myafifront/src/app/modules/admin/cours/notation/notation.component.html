<div class="p-4 border rounded shadow-sm max-w-lg mx-auto">
  <h3 class="font-semibold mb-3">
    Ma note du cours&nbsp;
  </h3>

  <form [formGroup]="form">
    <!-- Champ Note -->
    <label class="block mb-1 font-medium">Note (/20)&nbsp;:</label>
    <input type="number"
           formControlName="note"
           class="w-full border p-2 rounded mb-4"
           [readonly]="!withinWindow">

    <!-- Champ Appréciation -->
    <label class="block mb-1 font-medium">Appréciation&nbsp;:</label>
    <textarea rows="4"
              formControlName="appreciation"
              class="w-full border p-2 rounded"
              [readonly]="!withinWindow"></textarea>

    <!-- Bouton Sauvegarder -->
    <div *ngIf="withinWindow" class="mt-4 text-right">
      <button mat-raised-button color="primary"
              (click)="save()"
              [disabled]="form.invalid">
        Enregistrer
      </button>
    </div>
  </form>
</div>
