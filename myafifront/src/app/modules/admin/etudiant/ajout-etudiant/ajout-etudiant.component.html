<div class="flex flex-col md:min-w-160 max-h-screen divide-y-8 divide-bleue-claire-1 w-full">

    <div class=" flex  h-10 text-white  w-full -mb-0.5 justify-between  bg-rouge-1 p-1">
        
        <span class="mr-4 mt-1.5 font-bold">{{etudiantId == 0 ? ('Ajouter Etudiant' | titlecase) : ('Modifier Etudiant' | titlecase)}}</span>
      </div>
    <!-- Compose form -->
    <form class="flex flex-col flex-auto sm:p-8 overflow-y-auto bg-bleue-claire-6 w-full" [formGroup]="form">

        <!-- To -->
        <div class="grid grid-cols-1 gap-4 w-full">

            <div class="flex flex-col gt-xs:flex-row m-2">
                <ng-container>
                    <div class="flex">
                        <mat-form-field class="w-1/3 pr-2">
                            <mat-label>Nom</mat-label>
                            <input matInput [formControlName]="'nom'" oninput="this.value = this.value.toUpperCase()">
                        </mat-form-field>
    
                        <mat-form-field class="w-1/3 pl-2">
                            <mat-label>Prénom</mat-label>
                            <input matInput [formControlName]="'prenom'" oninput="this.value = this.value.toUpperCase()">
                        </mat-form-field>
    
                        <mat-form-field class="w-1/3 px-2">
                            <mat-label>Email</mat-label>
                            <input matInput type="email" [formControlName]="'email'">
                        </mat-form-field>
                    </div>
                    <div class="flex">
                    
                        <mat-form-field class="w-1/3 pr-2">
                            <mat-label>Date de Naissance</mat-label>
                            <input matInput [matDatepicker]="picker8"
                                [formControlName]="'dateDeNaissance'">
                            <mat-datepicker-toggle matSuffix
                                [for]="picker8"></mat-datepicker-toggle>
                            <mat-datepicker #picker8></mat-datepicker>
                        </mat-form-field>
    
                        <mat-form-field class="w-1/3 pl-2">
                            <mat-label>Filière</mat-label>
                            <input matInput [formControlName]="'filiere'" oninput="this.value = this.value.toUpperCase()">
                        </mat-form-field>
    
                        <mat-form-field class="w-1/3 px-2">
                            <mat-label>Téléphone</mat-label>
                            <input matInput [formControlName]="'telephone'" oninput="this.value = this.value.toUpperCase()">
                        </mat-form-field>
                    </div>

                
                </ng-container>
            </div>
        </div>

        <div class="flex items-center mt-4 sm:mt-0 justify-between">

            <!-- Buttons -->
            <button class="order-first sm:order-last" mat-flat-button [color]="'warn'" (click)="annuler()"
                *ngIf="!etudiant">
                Annuler
            </button>
            <button *ngIf="etudiant" class="order-first sm:order-last" mat-flat-button [color]="'warn'"
            [swal]="supprimerSwal">
                Supprimer
            </button>
            <button *ngIf="!etudiant" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
                [disabled]="!form.valid" [swal]="enregistrerSwal">
                Ajouter
            </button>
            <button *ngIf="etudiant" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
            [swal]="modifierSwal" [disabled]="!form.valid">
                Modifier
            </button>
        </div>
    </form>
</div>

<!-- Sweetalert modals -->
<swal #enregistrerSwal (confirm)="enregistrer()" [swalOptions]="Enregistrer"></swal>
<swal #annulerSwal (confirm)="annuler()" [swalOptions]="Annuler"></swal>
<swal #modifierSwal (confirm)="modifier()" [swalOptions]="Modifier"></swal>
<swal #supprimerSwal (confirm)="supprimer()" [swalOptions]="Supprimer"></swal>
