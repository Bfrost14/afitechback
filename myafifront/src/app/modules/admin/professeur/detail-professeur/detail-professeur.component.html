<div
  class=" w-full  border-solid border-bleu-foncee bg-white border-b-4 border-r-4 border-l-4 divide-y-8 divide-bleue-claire-1">

  <p class="flex bg-bleu-foncee h-10 text-white justify-between w-full -mb-0.5 justify-between">
    <span class="ml-4 mt-2 ">Détails professeur</span>
  </p>

  <div class="grid grid-cols-1 gap-1 divide-y-8 divide-bleue-claire-1">
    <div class="flex flex-col gt-xs:flex-row mt-1 h-10 bg-bleue-claire-6">
      <fuse-alert class="mt-8 -mb-4" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
        [@shake]="alert.type === 'error'">
        {{alert.message}}
      </fuse-alert>
      <div class="flex items-center mt-4 sm:mt-0 justify-between">
        <button class="order-first sm:order-last" mat-flat-button [color]="'warn'" [swal]="restaurationSwal">
          Restauration mot de passe
        </button>
        <button class="order-first sm:order-last" mat-flat-button [color]="'primary'" [swal]="activationCompte">
          {{professeur.activated == true ? "Désactivation compte" : "Activation compte"}}
        </button>
      </div>
    </div>

    <div class="flex flex-col gt-xs:flex-row">

      <mat-card>

        <mat-card-content class=" flex justify-center">

          <mat-tab-group class="w-full">


            <mat-tab>
              <ng-template mat-tab-label>
                <button class="btspan">{{'Identification'}}</button>

              </ng-template>

              <div class=" w-full rounded-md  bg-white border-4 ">
                <mat-card>
                  <div class="grid grid-cols-2 gap-4 divide-x-4 ">
                    <div class="flex flex-col gt-xs:flex-row">


                      <div class="truncate hover:text-clip flex justify-between">
                        <span>

                          <p>
                            <span class=" ml-2  text-black">{{'Matricule'}}:</span>
                            <span class="ml-2 text-slate-500">{{professeur?.matricule}}</span>
                          </p>
                          <p>
                            <span class=" ml-2  text-black">{{'Prénom'}}:</span>
                            <span class="ml-2 text-slate-500">{{professeur?.firstName}}</span>
                          </p>
                          <p>
                            <span class=" ml-2  text-black">{{'Nom'}}:</span>
                            <span class="ml-2 text-slate-500">{{professeur?.lastName}}</span>
                          </p>
                        </span>


                      </div>


                    </div>

                    <div class="flex flex-col gt-xs:flex-row">



                      <div class="truncate hover:text-clip flex justify-between">
                        <span>
                          <span class=" ml-2 text-black">{{'Email'}}:</span>
                          <span class="ml-2 text-slate-500">{{professeur?.email}}</span>

                        </span>


                      </div>

                        <p class="truncate hover:text-clip">
                        <span class=" ml-2 text-black">{{'Sexe'}}:</span>
                        <span class="ml-2 text-slate-500">{{professeur?.sexe}}</span>

                      </p>
                      


                      <p class="truncate hover:text-clip"> <span class=" ml-2  text-black">{{'Téléphone'}}:</span><span
                          class="ml-2 text-slate-500">{{professeur?.telephone}}</span></p>

                    </div>

                  </div>
                </mat-card>
              </div>
            </mat-tab>
          </mat-tab-group>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>

<swal #activationCompte (confirm)="activation()" [swalOptions]="Enregistrer"></swal>
<swal #restaurationSwal (confirm)="resetPassword()" [swalOptions]="Supprimer"></swal>
