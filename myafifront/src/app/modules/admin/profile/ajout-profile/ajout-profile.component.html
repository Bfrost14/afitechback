<div class="flex flex-col md:min-w-160 max-h-screen divide-y-8 divide-bleue-claire-1 w-full">

    <div class=" flex  h-10 text-white  w-full -mb-0.5 justify-between  bg-rouge-1 p-1">
        <span class="mr-4 mt-1.5 font-bold">{{profile == undefined ? ('Ajouter Profile' | titlecase) : ('Modifier
            Profile' | titlecase)}}</span>
    </div>
    <!-- Compose form -->
    <form class="flex flex-col flex-auto sm:p-8 overflow-y-auto bg-bleue-claire-6 w-full" [formGroup]="form">

        <!-- To -->
        <div class="grid grid-cols-1 gap-4 w-full">

            <div class="flex flex-col gt-xs:flex-row m-2">
                <ng-container>
                    <div class="flex">
                        <mat-form-field class="w-1/3 pr-2">
                            <mat-label>Nom</mat-label>
                            <input matInput [formControlName]="'nom'" oninput="this.value = this.value.toUpperCase()">
                        </mat-form-field>

                        <mat-form-field class="w-1/3 pl-2">
                            <mat-label>Page de redirection par défaut</mat-label>
                            <mat-select [formControlName]="'redirection'">
                                <mat-option *ngFor="let link of allLinks" [value]="link.link">
                                    {{link.title}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>

                        <mat-form-field class="w-1/3 px-2">
                            <mat-label>Type Profil</mat-label>
                            <mat-select [formControlName]="'typeProfil'">
                                <mat-option *ngFor="let profil of allProfil" [value]="profil">
                                    {{profil}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <!-- Authority Multi-Select -->
                    <div class="flex w-full mt-4">
                        <mat-form-field class="w-full">
                            <mat-label>Authorities</mat-label>
                            <mat-select [formControlName]="'authorities'" multiple>
                                <mat-option>
                                    <ngx-mat-select-search [formControl]="authorityFilterCtrl"
                                        placeholderLabel="Rechercher..." noEntriesFoundLabel="Aucun résultat trouvé">
                                    </ngx-mat-select-search>
                                </mat-option>
                                <mat-option *ngFor="let authority of filteredAuthorities | async" [value]="authority">
                                    {{authority.name}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </ng-container>
            </div>
        </div>

        <div class="flex items-center mt-4 sm:mt-0 justify-between">
            <!-- Buttons -->
            <button class="order-first sm:order-last" mat-flat-button [color]="'warn'" (click)="annuler()"
                *ngIf="!profile">
                Annuler
            </button>

            <ng-container *hasAuthority="'SUPPRESSION_PROFIL'">
                <button *ngIf="profile" class="order-first sm:order-last" mat-flat-button [color]="'warn'"
                    [swal]="supprimerSwal">
                    Supprimer
                </button>
            </ng-container>
            <button *ngIf="!profile" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
                [disabled]="!form.valid" [swal]="enregistrerSwal">
                Ajouter
            </button>
            <ng-container *hasAuthority="'MODIFICATION_PROFIL'">
                <button *ngIf="profile" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
                    [swal]="modifierSwal" [disabled]="!form.valid">
                    Modifier
                </button>
            </ng-container>

        </div>
    </form>
</div>

<!-- Sweetalert modals -->
<swal #enregistrerSwal (confirm)="enregistrer()" [swalOptions]="Enregistrer"></swal>
<swal #annulerSwal (confirm)="annuler()" [swalOptions]="Annuler"></swal>
<swal #modifierSwal (confirm)="modifier()" [swalOptions]="Modifier"></swal>
<swal #supprimerSwal (confirm)="supprimer()" [swalOptions]="Supprimer"></swal>
