<div class="flex flex-col md:min-w-160 max-h-screen divide-y-8 divide-bleue-claire-1 w-full">

    <div class=" flex  h-10 text-white  w-full -mb-0.5 justify-between  bg-rouge-1 p-1">

        <span class="mr-4 mt-1.5 font-bold">{{matiere == undefined ? ('Ajouter Matiere' | titlecase) : ('Modifier
            Matiere' |
            titlecase)}}</span>
    </div>
    <!-- Compose form -->
    <form class="flex flex-col flex-auto sm:p-8 overflow-y-auto bg-bleue-claire-6 w-full" [formGroup]="form">

        <!-- To -->
        <div class="grid grid-cols-1 gap-4 w-full">

            <div class="flex flex-col gt-xs:flex-row m-2">
                <div formArrayName="matieres">
                    <div *ngFor="let field of detailFilds.controls; let i = index">
                        <div [formGroupName]="i">
                            <div class="flex">


                                <mat-form-field class="w-1/3 pr-2">
                                    <mat-label>{{'Nom'}}</mat-label>
                                    <input type="text" matInput formControlName="nom">

                                    <mat-error *ngIf="field.get('nom').hasError('required')">
                                        {{ 'le.nom.doit.etre.saisi' }}</mat-error>
                                </mat-form-field>


                                <mat-form-field class="w-1/3 pl-2">
                                    <mat-label>{{'Coéfficient'}}</mat-label>
                                    <input matInput [formControlName]="'credit'" type="number" min="0"
                                        oninput="this.value = this.value.toUpperCase()">
                                    <mat-error *ngIf="field.get('credit').hasError('required')">
                                        {{ 'credit.doit.etre.saisi' }}</mat-error>
                                </mat-form-field>


                                <mat-form-field class="w-1/3 px-2">
                                    <mat-label>UE</mat-label>
                                    <input type="text" matInput formControlName="ue" [matAutocomplete]="auto"
                                        (keyup)="getAllUe($event.target.value)">
                                    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
                                        <mat-option *ngFor="let option of ue " [value]="option">
                                            {{option.nom}}
                                        </mat-option>
                                    </mat-autocomplete>
                                    <mat-error *ngIf="field.get('ue').hasError('required')">
                                        {{ 'l\'.ue.doit.etre.choisi' }}</mat-error>
                                </mat-form-field>
                            </div>

                            <div class="w-1/3 pr-2" *ngIf="matiere == undefined">
                                <button mat-fab color="primary" (click)="addFieldDetail()" type="button">
                                    <mat-icon>add</mat-icon>
                                </button>
                                <button mat-fab color="danger" (click)="removeFieldDetail(i)" type="button">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>

                        </div>
                        <hr>
                    </div>
                </div>

            </div>
        </div>

        <div class="flex items-center mt-4 sm:mt-0 justify-between">

            <!-- Buttons -->
            <button class="order-first sm:order-last" mat-flat-button [color]="'warn'" (click)="annuler()"
                *ngIf="!matiere">
                Annuler
            </button>

            <ng-container *hasAuthority="'SUPPRESSION_MATIERE'">
                <button *ngIf="matiere" class="order-first sm:order-last" mat-flat-button [color]="'warn'"
                    [swal]="supprimerSwal">
                    Supprimer
                </button>
            </ng-container>
            <button *ngIf="!matiere" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
                [disabled]="!form.valid" [swal]="enregistrerSwal">
                Ajouter
            </button>
            <ng-container *hasAuthority="'MODIFICATION_MATIERE'">
                <button *ngIf="matiere" class="order-first sm:order-last" mat-flat-button [color]="'primary'"
                    [swal]="modifierSwal" [disabled]="!form.valid">
                    Modifier
                </button>
            </ng-container>

        </div>
    </form>
</div>

<!-- Sweetalert modals -->
<swal #enregistrerSwal (confirm)="enregistrer()" [swalOptions]="Enregistrer"></swal>
<swal #annulerSwal (confirm)="annuler()" [swalOptions]="Annuler"></swal>
<swal #modifierSwal (confirm)="modifier()" [swalOptions]="Modifier"></swal>
<swal #supprimerSwal (confirm)="supprimer()" [swalOptions]="Supprimer"></swal>
