<div class="grid grid-cols-1 justify-center w-full">
  <div class="m-4">
    <div class="grid grid-col-1 divide-y-8 divide-blue-100">
      <!-- En-tête -->
      <div *ngIf="!canEditNote" class="text-sm italic text-gray-600">
        ⚠️ Vous avez déjà saisie les notes.
      </div>



      <!-- Tableau -->
      <form [formGroup]="noteForm">
        <table mat-table [dataSource]="dataSource" matSort matSortDisableClear class="mat-elevation-z8 w-full">

          <!-- Colonne Sélection -->
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef class="bg-blue-50 text-gray-700 font-semibold">
              <mat-checkbox (change)="$event ? masterToggle() : null"
                [checked]="selection.hasValue() && isAllSelected()"
                [indeterminate]="selection.hasValue() && !isAllSelected()" [disabled]="!canEditNote">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)" [disabled]="!canEditNote">
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Colonnes étudiantes -->
          <ng-container *ngFor="let column of ['matricule', 'nom']" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-blue-50 text-gray-700 font-semibold">
              {{column | titlecase}}
            </th>
            <td mat-cell *matCellDef="let element">
              <ng-container [ngSwitch]="column">
                <ng-container *ngSwitchCase="'matricule'">{{element.matricule ||
                  element?.user?.matricule}}</ng-container>
                <ng-container *ngSwitchCase="'nom'">
                  {{element.firstName || element?.user?.firstName}} {{element.lastName || element?.user?.lastName}}
                </ng-container>
              </ng-container>
            </td>
          </ng-container>

          <!-- Colonne Présence -->

          <ng-container matColumnDef="matiere">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-blue-50 text-gray-700 font-semibold">
              {{'matiere' | titlecase}}
            </th>
            <td mat-cell *matCellDef="let element">
              
               {{element?.matiereUser?.matiere?.nom | uppercase}}

            </td>
          </ng-container>


          <!-- Colonne Note -->
          <ng-container matColumnDef="note">
            <th mat-header-cell *matHeaderCellDef class="bg-blue-50 text-gray-700 font-semibold">
              Note (/20)
            </th>
            <td mat-cell *matCellDef="let element; let i = index">
              <div [formGroup]="notes.at(i)">
                <input type="number" formControlName="valeur" min="0" max="20" step="0.5"
                  class="w-24 border p-1 rounded" [readonly]="!canEditNote" (change)="onNoteChanged(i)">

              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </form>

      <!-- Pagination -->
      <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
        showFirstLastButtons class="flex justify-end">
      </mat-paginator>

      <!-- Bouton de sauvegarde -->
      <div class="flex justify-end mt-4" *ngIf="showSaveButton && selection.hasValue() && canEditNote">
        <button mat-raised-button color="primary" (click)="saveNotes()">
          Enregistrer les notes
        </button>
      </div>
    </div>
  </div>
</div>
